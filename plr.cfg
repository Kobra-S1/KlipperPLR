[force_move]
enable_force_move: True

# Startup auto-homing: disabled because it forces homed_axes to xyz and masks real homing state.
# PLR recovery files set kinematic position for Z themselves and home X/Y, so this block is not needed.
# [delayed_gcode KINEMATIC_POSITION]
# initial_duration:0.2
# gcode:
#       SET_KINEMATIC_POSITION X=0
#       SET_KINEMATIC_POSITION Y=0
#       SET_KINEMATIC_POSITION Z=0

[respond]
default_type: echo

[gcode_macro G31]
gcode:
      RUN_SHELL_COMMAND CMD=clear_plr

[gcode_shell_command clear_plr]
command: bash {USER_HOME}/printer_data/plr/clear_plr.sh
timeout: 5.

[gcode_macro save_last_file]
gcode:
  {% set filepath = printer.virtual_sdcard.file_path %}
  # If we are currently running a PLR recovery file, do NOT overwrite the
  # saved filepath — the recovery file is in gcodes/plr/ and is a derived
  # artefact.  Keeping the original filepath ensures that a second power loss
  # during recovery can still be processed against the original gcode.
  {% if '/plr/' in filepath %}
    M118 PLR recovery in progress - skipping save_last_file
  {% else %}
    {% set filename = filepath.split('/') %}
    SAVE_VARIABLE VARIABLE=last_file VALUE='"{ filename[-1] }"'
    SAVE_VARIABLE VARIABLE=filepath VALUE='"{ filepath }"'
    M118 Last File: { filename[-1] }
  {% endif %}

[gcode_macro clear_last_file]
gcode:
  {% set filename='' %}
  {% set filepath='' %}
  SAVE_VARIABLE VARIABLE=last_file VALUE='"{ filename }"'
  SAVE_VARIABLE VARIABLE=filepath VALUE='"{ filepath }"'
  
[gcode_shell_command POWER_LOSS_RESUME]
command: bash {USER_HOME}/printer_data/plr/plr.sh
timeout: 420.

[gcode_macro RESUME_INTERRUPTED]
gcode =
    # Dismiss any open prompt dialog first
    RESPOND TYPE=command MSG="action:prompt_end"

    SET_GCODE_OFFSET Z=0 MOVE=0
    {% set z_height = params.Z_HEIGHT|default(printer.save_variables.variables.power_resume_z)|float %}
    {% set last_file = params.GCODE_FILE|default(printer.save_variables.variables.last_file)|string %}
    
    {% set ext_temp = printer.save_variables.variables.power_resume_ext_temp|default(0)|float %}
    {% set bed_temp = printer.save_variables.variables.power_resume_bed_temp|default(0)|float %}
    {% set fan_speed = printer.save_variables.variables.power_resume_fan_speed|default(0)|float %}
    {% set active_tool = printer.save_variables.variables.power_resume_active_tool|default(-1)|int %}

    M118 Resuming {last_file} at Z={z_height}
    
    # 1. Heat up bed first, wait
    {% if bed_temp > 0 %}
      M118 Heating Bed to {bed_temp}...
      M190 S{bed_temp}
    {% endif %}
    
    # 2. Heat up Extruder, wait
    {% if ext_temp > 0 %}
      M118 Heating Extruder to {ext_temp}...
      M109 S{ext_temp}
    {% endif %}

    # 3. Restore Fan Speed (Converting 0-1 range to 0-255)
    {% if fan_speed > 0 %}
      M106 S{(fan_speed * 255)|int}
    {% else %}
      M107
    {% endif %}

    RUN_SHELL_COMMAND CMD=POWER_LOSS_RESUME PARAMS="{z_height} \"{last_file}\""
    # Wait for Moonraker to index the recovery file metadata (thumbnail)
    G4 P2000
    SDCARD_PRINT_FILE FILENAME=plr/"{last_file}"

[gcode_macro LOG_Z]
gcode:
    {% set z_pos = printer.gcode_move.gcode_position.z %}
    {% set ext_temp = printer.extruder.target %}
    {% set bed_temp = printer.heater_bed.target %}
    {% set fan_speed = printer.fan.speed %}

    RESPOND MSG="Current Z is {z_pos}"
    SAVE_VARIABLE VARIABLE=power_resume_z VALUE={z_pos}
    SAVE_VARIABLE VARIABLE=power_resume_ext_temp VALUE={ext_temp}
    SAVE_VARIABLE VARIABLE=power_resume_bed_temp VALUE={bed_temp}
    SAVE_VARIABLE VARIABLE=power_resume_fan_speed VALUE={fan_speed}

[save_variables]
filename ={USER_HOME}/printer_data/config/variables.cfg

[gcode_macro _PLR_PRIME_NOZZLE]
description: Purges the nozzle before continuing the print.
gcode:
    M118 Priming nozzle after power loss...
    SAVE_GCODE_STATE NAME=PLR_PRIME_STATE
    
    G90 ; Absolute coordinates

    # ---- Tool Restoration ----
    # Must happen AFTER X/Y are homed, but BEFORE the purge move!
    {% set active_tool = params.T|default(-1)|int %}
    {% if active_tool >= 0 %}
      M118 Restoring Tool T{active_tool}...
      # Safe guard: use "in printer" for both checks — printer["key"] raises
      # KeyError before "is defined" can evaluate if the key doesn't exist.
      {% if "gcode_macro ACE_ENABLE_FEED_ASSIST" in printer and
            "output_pin ACE_Pro" in printer and printer["output_pin ACE_Pro"].value %}
          ACE_ENABLE_FEED_ASSIST T={active_tool}
      {% endif %}
      T{active_tool}
    {% endif %}
    # --------------------------
    
    TO_THROW_POSITION 

    RESPOND TYPE=echo MSG="Purging nozzle..."
    G92 E0
    G1 E50 F400
    TO_THROW_POSITION
    G1 E-1 F1800    
    G1 X48 Y220 F18000  
    WIPE_ENTER
    WIPE_NOZZLE
    WIPE_STOP
    WIPE_EXIT
    
    RESTORE_GCODE_STATE NAME=PLR_PRIME_STATE

[delayed_gcode CHECK_PLR_STATE]
initial_duration: 2.0
gcode:
    {% set saved_file = printer.save_variables.variables.last_file|default("")|string %}
    {% set z_height = printer.save_variables.variables.power_resume_z|default(0)|float %}
    
    # Only show the PLR prompt when the printer is ready.  After a "Timer too
    # close" shutdown the MCU is not yet usable — showing the prompt would let
    # the user click Resume while heaters/steppers are offline, cascading into
    # more shutdown errors.  The user must FIRMWARE_RESTART first; Klipper will
    # re-run this delayed_gcode on the fresh startup.
    {% if printer.idle_timeout.state == "Idle" or printer.idle_timeout.state == "Ready" %}
      # If last_file is empty, it means no print was interrupted or it was cleanly finished
      {% if saved_file != "''" and saved_file != "" %}
        M118 Interrupted print detected!
        M118 File: {saved_file} at Z={z_height}
        RESPOND TYPE=command MSG="action:prompt_begin Power Loss Recovery"
        RESPOND TYPE=command MSG="action:prompt_text An interrupted print was detected."
        RESPOND TYPE=command MSG="action:prompt_text File: {saved_file}"
        RESPOND TYPE=command MSG="action:prompt_text Last Z Height: {z_height}mm"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Resume Print|RESUME_INTERRUPTED|primary"
        RESPOND TYPE=command MSG="action:prompt_button Clear PLR State|clear_last_file|error"
        RESPOND TYPE=command MSG="action:prompt_button Ignore|RESPOND MSG=\"Igoring PLR...\"|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
      {% endif %}
    {% else %}
      M118 PLR: Printer not ready (state: {printer.idle_timeout.state}), skipping recovery prompt.
      M118 PLR: Please FIRMWARE_RESTART first, then the recovery prompt will appear.
    {% endif %}

# Modify CANCEL_PRINT to always wipe the last file when you manually cancel!
